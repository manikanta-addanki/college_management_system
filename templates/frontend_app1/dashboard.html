<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Management Dashboard</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Page background */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top left, #4f46e5 0%, #1f2937 40%, #020617 100%);
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Main container */
.container {
    max-width: 1200px;
    width: 100%;
    margin: 30px 16px;
    padding: 32px 28px 28px;
    border-radius: 24px;
    background: rgba(15, 23, 42, 0.65);
    box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(148, 163, 184, 0.18);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
}

/* Header */
.header {
    text-align: center;
    color: #e5e7eb;
    margin-bottom: 32px;
}

.header h1 {
    font-size: 2.4rem;
    letter-spacing: 0.03em;
    text-shadow: 0 10px 30px rgba(15, 23, 42, 0.9);
}

/* Stats cards grid */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
}

/* Individual stat card */
.stat-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.85), rgba(30, 64, 175, 0.85));
    border-radius: 20px;
    padding: 22px 20px;
    text-align: left;
    box-shadow:
        0 16px 40px rgba(15, 23, 42, 0.8),
        0 0 0 1px rgba(148, 163, 184, 0.28);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}

/* Decorative highlight in corner */
.stat-card::before {
    content: "";
    position: absolute;
    inset: -40%;
    background:
        radial-gradient(circle at 0 0, rgba(251, 191, 36, 0.22), transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(96, 165, 250, 0.25), transparent 55%);
    opacity: 0.7;
    pointer-events: none;
}

/* Inner content above decoration */
.stat-card > * {
    position: relative;
    z-index: 1;
}

/* Hover effect */
.stat-card:hover {
    transform: translateY(-6px);
    box-shadow:
        0 22px 55px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(191, 219, 254, 0.55);
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(30, 64, 175, 0.95));
}

/* Icon + numbers */
.stat-icon {
    font-size: 2.1rem;
    margin-bottom: 10px;
}

/* Accent colors for icons */
.dept { color: #22c55e; }
.prin { color: #38bdf8; }
.hod { color: #facc15; }
.staff { color: #e879f9; }
.student { color: #fb7185; }

.stat-number {
    font-size: 2.4rem;
    font-weight: 700;
    color: #f9fafb;
    margin-bottom: 4px;
}

.stat-label {
    font-size: 0.98rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e5e7eb;
    opacity: 0.78;
}

/* Navigation buttons grid */
.nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
}

/* Turn <a> into button-like tiles */
.nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    border: none;
    padding: 16px 18px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    color: #e5e7eb;
    background: radial-gradient(circle at 0 0, rgba(248, 250, 252, 0.08), transparent 50%),
                rgba(15, 23, 42, 0.7);
    box-shadow:
        0 10px 25px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(148, 163, 184, 0.45);
    transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        background 0.22s ease,
        color 0.22s ease;
}

/* Button hover effects */
.nav-btn:hover {
    transform: translateY(-4px);
    background: radial-gradient(circle at 0 0, rgba(96, 165, 250, 0.22), transparent 55%),
                rgba(15, 23, 42, 0.9);
    box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(191, 219, 254, 0.7);
    color: #f9fafb;
}

/* Slight press on active */
.nav-btn:active {
    transform: translateY(-1px);
    box-shadow:
        0 10px 22px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(148, 163, 184, 0.7);
}

/* Mobile tweaks */
@media (max-width: 768px) {
    .container {
        padding: 22px 18px 20px;
        margin: 18px 10px;
        border-radius: 18px;
    }

    .header h1 {
        font-size: 1.9rem;
    }

    .stat-number {
        font-size: 2.1rem;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏫 College Management System</h1>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon dept">🏢</div>
                <div class="stat-number">{{ departments_count }}</div>
                <div class="stat-label">Departments</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon prin">👨‍🎓</div>
                <div class="stat-number">{{ principals_count }}</div>
                <div class="stat-label">Principals</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon hod">👨‍🏫</div>
                <div class="stat-number">{{ hods_count }}</div>
                <div class="stat-label">HODs</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon staff">👨‍💼</div>
                <div class="stat-number">{{ staff_count }}</div>
                <div class="stat-label">Staff</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon student">🎓</div>
                <div class="stat-number">{{ students_count }}</div>
                <div class="stat-label">Students</div>
            </div>
        </div>
        
        <div class="nav-grid">
            <a href="{% url 'department_list' %}" class="nav-btn">📂 Departments</a>
            <a href="{% url 'principal_list' %}" class="nav-btn">👨‍🎓 Principals</a>
            <a href="{% url 'hod_list' %}" class="nav-btn">👨‍🏫 HODs</a>
            <a href="{% url 'staff_list' %}" class="nav-btn">👨‍💼 Staff</a>
            <a href="{% url 'student_list' %}" class="nav-btn">🎓 Students</a>
        </div>
    </div>
</body>
</html>
