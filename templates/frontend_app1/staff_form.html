<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Form</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top left, #4f46e5 0%, #1f2937 40%, #020617 100%);
    padding: 24px 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Main form container */
.container {
    max-width: 600px;
    width: 100%;
    margin: 0 16px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 24px;
    box-shadow:
        0 32px 80px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.18);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    overflow: hidden;
}

/* Header section */
.header {
    background: linear-gradient(135deg, rgba(232, 121, 249, 0.95), rgba(168, 85, 247, 0.95));
    color: #f9fafb;
    padding: 32px 32px 28px;
    text-align: center;
}

.header h1 {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-shadow: 0 8px 24px rgba(232, 121, 249, 0.4);
}

/* Form container */
.form-container {
    padding: 40px 36px 36px;
}

/* Form groups */
.form-group {
    margin-bottom: 28px;
}

label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #e5e7eb;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
}

/* Input and select styling */
input, select {
    width: 100%;
    padding: 16px 20px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    background: rgba(30, 41, 59, 0.8);
    color: #f9fafb;
    box-shadow:
        inset 0 2px 8px rgba(0, 0, 0, 0.3),
        0 4px 12px rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(12px);
    transition: all 0.25s ease;
}

input::placeholder {
    color: #94a3b8;
}

input:focus, select:focus {
    outline: none;
    background: rgba(51, 65, 85, 0.95);
    box-shadow:
        0 0 0 3px rgba(232, 121, 249, 0.3),
        0 8px 24px rgba(232, 121, 249, 0.2),
        inset 0 1px 4px rgba(0, 0, 0, 0.2);
    transform: translateY(-1px);
}

/* Button group */
.btn-group {
    display: flex;
    gap: 16px;
    margin-top: 36px;
}

.btn {
    flex: 1;
    padding: 16px 24px;
    border: none;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    backdrop-filter: blur(12px);
}

/* Primary button (purple for staff) */
.btn-primary {
    background: linear-gradient(135deg, rgba(232, 121, 249, 0.95), rgba(168, 85, 247, 0.95));
    color: #f9fafb;
    box-shadow:
        0 12px 32px rgba(232, 121, 249, 0.4),
        0 0 0 1px rgba(232, 121, 249, 0.3);
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow:
        0 20px 45px rgba(232, 121, 249, 0.5),
        0 0 0 1px rgba(232, 121, 249, 0.6);
}

/* Secondary button (Cancel) */
.btn-secondary {
    background: linear-gradient(135deg, rgba(107, 114, 128, 0.8), rgba(75, 85, 99, 0.8));
    color: #e5e7eb;
    box-shadow:
        0 12px 32px rgba(15, 23, 42, 0.6),
        0 0 0 1px rgba(148, 163, 184, 0.4);
}

.btn-secondary:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, rgba(107, 114, 128, 0.95), rgba(75, 85, 99, 0.95));
    box-shadow:
        0 20px 45px rgba(15, 23, 42, 0.8),
        0 0 0 1px rgba(148, 163, 184, 0.6);
    color: #f9fafb;
}

/* Message alerts */
div[style*="background: #f8d7da"] {
    padding: 18px 22px !important;
    margin-bottom: 24px !important;
    border-radius: 16px !important;
    background: rgba(232, 121, 249, 0.15) !important;
    color: #e879f9 !important;
    border: 1px solid rgba(232, 121, 249, 0.3) !important;
    box-shadow: 0 8px 24px rgba(232, 121, 249, 0.2) !important;
    backdrop-filter: blur(12px) !important;
}

/* Mobile responsive */
@media (max-width: 768px) {
    body {
        padding: 16px 0;
    }
    
    .container {
        margin: 0 12px;
        border-radius: 20px;
    }
    
    .form-container {
        padding: 28px 24px 28px;
    }
    
    .header {
        padding: 24px 24px 20px;
    }
    
    .header h1 {
        font-size: 1.6rem;
    }
    
    .btn-group {
        flex-direction: column;
    }
    
    input, select {
        padding: 14px 18px;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍💼 Staff Form</h1>
        </div>
        <div class="form-container">
            {% if messages %}
                {% for message in messages %}
                    <div style="padding: 15px; background: #f8d7da; color: #721c24; border-radius: 8px; margin-bottom: 20px;">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Name</label>
                    {{ form.name }}
                </div>
                <div class="form-group">
                    <label>Email</label>
                    {{ form.email }}
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    {{ form.phone }}
                </div>
                <div class="form-group">
                    <label>Department</label>
                    {{ form.department }}
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Save Staff</button>
                    <a href="{% url 'staff_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
