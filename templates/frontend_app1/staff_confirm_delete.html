<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Staff</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top left, #4f46e5 0%, #1f2937 40%, #020617 100%);
    padding: 20px 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Main delete confirmation container */
.container {
    max-width: 500px;
    width: 100%;
    margin: 0 16px;
    background: rgba(15, 23, 42, 0.9);
    border-radius: 24px;
    box-shadow:
        0 32px 80px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.2);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    overflow: hidden;
}

/* Header section */
.header {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(220, 38, 38, 0.95));
    color: #f9fafb;
    padding: 32px 40px;
    text-align: center;
}

.header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
}

/* Content area */
.content {
    padding: 40px 36px 36px;
    text-align: center;
}

/* Item info card */
.item-info {
    background: rgba(30, 41, 59, 0.8);
    padding: 24px 28px;
    border-radius: 20px;
    margin-bottom: 28px;
    border: 1px solid rgba(239, 68, 68, 0.3);
    box-shadow:
        0 12px 32px rgba(15, 23, 42, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
}

.item-name {
    font-size: 1.4rem;
    font-weight: 700;
    color: #f9fafb;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
}

.item-info > div:nth-child(2),
.item-info > div:nth-child(3) {
    color: #94a3b8;
    font-size: 0.95rem;
    margin-top: 4px;
}

/* Warning message */
.warning {
    color: #fca5a5;
    font-weight: 600;
    margin: 24px 0;
    font-size: 1.1rem;
    line-height: 1.6;
    background: rgba(239, 68, 68, 0.12);
    padding: 20px 24px;
    border-radius: 16px;
    border: 1px solid rgba(239, 68, 68, 0.25);
    box-shadow: 0 8px 24px rgba(239, 68, 68, 0.15);
}

/* Button base styles */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 24px;
    border: none;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(12px);
    flex: 1;
}

/* Danger button (Delete) */
.btn-danger {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(220, 38, 38, 0.95));
    color: #f9fafb;
    box-shadow:
        0 12px 32px rgba(239, 68, 68, 0.4),
        0 0 0 1px rgba(239, 68, 68, 0.3);
}

.btn-danger:hover {
    transform: translateY(-3px);
    box-shadow:
        0 20px 45px rgba(239, 68, 68, 0.5),
        0 0 0 1px rgba(239, 68, 68, 0.6);
}

/* Secondary button (Cancel) */
.btn-secondary {
    background: linear-gradient(135deg, rgba(107, 114, 128, 0.8), rgba(75, 85, 99, 0.8));
    color: #e5e7eb;
    box-shadow:
        0 12px 32px rgba(15, 23, 42, 0.6),
        0 0 0 1px rgba(148, 163, 184, 0.4);
}

.btn-secondary:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, rgba(107, 114, 128, 0.95), rgba(75, 85, 99, 0.95));
    box-shadow:
        0 20px 45px rgba(15, 23, 42, 0.8),
        0 0 0 1px rgba(148, 163, 184, 0.6);
    color: #f9fafb;
}

/* Button group */
.btn-group {
    display: flex;
    gap: 16px;
    margin-top: 8px;
}

/* Mobile responsive */
@media (max-width: 768px) {
    body {
        padding: 16px 0;
    }
    
    .container {
        margin: 0 12px;
        border-radius: 20px;
    }
    
    .header {
        padding: 24px 28px;
    }
    
    .header h1 {
        font-size: 1.5rem;
    }
    
    .content {
        padding: 28px 24px 28px;
    }
    
    .item-info {
        padding: 20px 24px;
    }
    
    .warning {
        font-size: 1rem;
        padding: 16px 20px;
        margin: 20px 0;
    }
    
    .btn-group {
        flex-direction: column;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗑️ Delete Staff</h1>
        </div>
        <div class="content">
            <div class="item-info">
                <div class="item-name">{{ staff.name }}</div>
                <div>{{ staff.email }}</div>
                <div>{{ staff.phone }}</div>
            </div>
            <div class="warning">Are you sure you want to delete this staff?</div>
            <form method="post">
                {% csrf_token %}
                <div class="btn-group">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'staff_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
